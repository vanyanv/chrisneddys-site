name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start server
        # No env vars needed: same as the Build step above, this runs with no
        # DATABASE_URL/PGLITE_DATA_DIR, so the storefront falls back to the
        # in-repo catalogue (src/data/merch.ts) — see scripts/db-prepare.mjs
        # and DEPLOY.md's "Database" section.
        run: |
          pnpm exec next start -p 3400 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3400/ > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start in time" >&2
          exit 1

      - name: Performance budget
        run: pnpm perf:budget --base http://localhost:3400
