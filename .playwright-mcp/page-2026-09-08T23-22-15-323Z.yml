          - heading "My recommendation" [level=3] [ref=e263]
          - paragraph [ref=e264]:
            - strong [ref=e265]: Ship A now, book the call for B this week.
            - text: A costs nothing and makes the site honest immediately. B is almost certainly already available on your plan or one tier up, and it removes the domain jump â€” which is the single biggest drop-off point in the current flow. C only earns its cost once you can see how many orders are coming direct, which you can't measure until B is live.
          - paragraph [ref=e266]:
            - text: The prototype deliberately shows the
            - emphasis [ref=e267]: B/C
            - text: experience so you can feel what's on the other side of that call. If the answer from Otter is no, we fall back to A and the menu work is still worth every hour â€” prices and hours on your own domain are the fix regardless of who takes the payment.
        - list [ref=e269]:
          - listitem [ref=e270]: What plan are you on with Otter today? Lite/Standard/Premium decides whether B is a config change or an upgrade.
          - listitem [ref=e271]: Is the current storefront the commission-free Direct product, or a marketplace channel? The URL alone doesn't tell us.
          - listitem [ref=e272]: What's the POS? Otter integrates with Clover, Square and Toast among others, and the POS determines how cleanly menu sync works.
          - listitem [ref=e273]: Who can approve an API request? Partner access takes lead time; starting it now costs nothing even if you never use it.
