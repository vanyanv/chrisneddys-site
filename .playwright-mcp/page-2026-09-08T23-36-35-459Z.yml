        - heading "My recommendation" [level=3] [ref=f1e476]
        - paragraph [ref=f1e477]:
          - strong [ref=f1e478]: Ship A now, book the call for B this week.
          - text: A costs nothing and makes the site honest immediately. B is likely already on your plan or one tier up, and it removes the domain jump â€” the single biggest drop-off in the current flow. C only earns its cost once you can see how many orders come direct, which you can't measure until B is live.
        - paragraph [ref=f1e479]:
          - text: The prototype deliberately shows the
          - emphasis [ref=f1e480]: B/C
          - text: experience so you can feel what's on the other side of that call. If Otter says no, we fall back to A and the menu work is still worth every hour â€” prices and hours on your own domain are the fix regardless of who takes the payment.
      - list [ref=f1e482]:
        - listitem [ref=f1e483]: What plan are you on with Otter today? Lite/Standard/Premium decides whether B is a config change or an upgrade.
