              - text: slug. The storefront's own canonical is
              - code [ref=f34e367]: chris-n-eddys
              - text: . Prices are identical on both â€” but use the clean one.
          - row [ref=f34e368]:
            - cell "Modifier prefill" [ref=f34e369]
            - cell "NOT POSSIBLE" [ref=f34e370]
            - cell "Toppings can't be set from a URL. So the site must not make people pick toppings twice â€” it names the boxes instead." [ref=f34e371]
          - row [ref=f34e372]:
