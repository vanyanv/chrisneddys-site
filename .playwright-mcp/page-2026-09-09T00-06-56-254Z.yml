            - cell "WORKS" [ref=f34e359]
            - cell [ref=f34e360]:
              - text: Appending
              - code [ref=f34e361]: "/{Item Name}/{item-uuid}"
              - text: to the store URL opens that item's add-to-cart modal directly. Every item on your site can be one tap from being in a cart.
          - row [ref=f34e362]:
            - cell "Canonical URL" [ref=f34e363]
            - cell "WRONG ONE" [ref=f34e364]
