        - rowgroup [ref=f35e356]:
          - row [ref=f35e357]:
            - cell "Item deep links" [ref=f35e358]
            - cell "WORKS" [ref=f35e359]
            - cell [ref=f35e360]:
              - text: Appending
              - code [ref=f35e361]: "/{Item Name}/{item-uuid}"
              - text: to the store URL opens that item's add-to-cart modal directly. Every item on your site can be one tap from being in a cart.
          - row [ref=f35e362]:
            - cell "Canonical URL" [ref=f35e363]
            - cell "WRONG ONE" [ref=f35e364]
            - cell [ref=f35e365]:
              - text: Your site links the
              - code [ref=f35e366]: chris-n-eddys-(3pd)
              - text: slug. The storefront's own canonical is
              - code [ref=f35e367]: chris-n-eddys
              - text: . Prices are identical on both â€” but use the clean one.
          - row [ref=f35e368]:
            - cell "Modifier prefill" [ref=f35e369]
            - cell "NOT POSSIBLE" [ref=f35e370]
            - cell "Toppings can't be set from a URL. So the site must not make people pick toppings twice â€” it names the boxes instead." [ref=f35e371]
          - row [ref=f35e372]:
            - cell "Multi-item cart prefill" [ref=f35e373]
