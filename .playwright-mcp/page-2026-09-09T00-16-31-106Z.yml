      - generic [ref=f37e389]: The design consequence
      - heading "No cart. One tap per item." [level=2] [ref=f37e390]
      - generic [ref=f37e391]:
        - heading "Why the cart from round two is gone" [level=3] [ref=f37e392]
        - paragraph [ref=f37e393]:
          - text: Round two had a working cart because it was showing you the world where Otter's API exists. With Otter Direct only, a cart on your domain would collect four items and then drop the customer on a storefront with an empty basket.
          - strong [ref=f37e394]: That is strictly worse than no cart.
          - text: "So this build removes it and spends the interaction budget on the part that actually works: getting a person from \"I want that\" to \"it's in the cart\" in a single tap."
      - generic [ref=f37e395]:
        - heading "What replaces it" [level=3] [ref=f37e396]
        - paragraph [ref=f37e397]:
          - strong [ref=f37e398]: Your menu is already combo-shaped
          - text: "â€” \"2 Sliders and Fries\" at $16.49 is a complete order, not a component. Most late-night orders are one line item. That makes per-item deep linking the right primitive, not a compromise: tap the combo on your site, land on that exact item in Otter with Add to cart ready."
        - paragraph [ref=f37e399]:
          - text: "And because toppings can't be prefilled, the item sheet does the next best thing: it names"
          - strong [ref=f37e400]: the exact checkboxes to tap on the next screen
          - text: for Chris's Way or Eddy's Way. Choosing a Way stays a decision made on your brand's page; the mechanical part happens once, in Otter, where it has to.
