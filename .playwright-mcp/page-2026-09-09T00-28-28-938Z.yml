    - generic [ref=f42e388]:
      - generic [ref=f42e389]: The map
      - heading "Why this one is drawn, and what ships instead." [level=2] [ref=f42e390]
      - paragraph [ref=f42e391]:
        - text: "You're right that a real site uses a real map provider. This artifact can't:"
        - strong [ref=f42e392]: Artifacts block external images and network requests entirely
        - text: ", so Google Maps JS, Mapbox GL and Leaflet all fail here in the same way â€” the library loads from a CDN, and then every tile request dies. You'd get an empty grey box with pins floating on it."
      - paragraph [ref=f42e393]:
        - text: "So the map above is the honest workaround:"
        - strong [ref=f42e394]: real OpenStreetMap geometry, fetched once and baked into the page as inline SVG
        - text: . The freeways, boulevards, water and the LA River are actual coordinates, the three pins are placed by real latitude and longitude, and the scale bar is computed from the projection â€” Van Nuys lands on Sherman Way × Van Nuys Blvd because that genuinely is the corner. Zero network requests at runtime, and the freeways can be brand yellow because we own the render. Attribution is on the map, as ODbL requires.
