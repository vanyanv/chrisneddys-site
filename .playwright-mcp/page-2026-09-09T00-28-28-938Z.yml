      - generic [ref=f42e445]:
        - heading "For three locations, don't ship a slippy map" [level=3] [ref=f42e446]
        - paragraph [ref=f42e447]:
          - text: "A visitor has exactly two questions:"
          - strong [ref=f42e448]: which one is closest
          - text: ", and"
          - strong [ref=f42e449]: get me there
          - text: . Neither is answered by pan and zoom â€” they're answered by a picture and a button. A pannable map is a widget people fiddle with instead of leaving for the navigation app they were always going to use.
        - paragraph [ref=f42e450]:
          - text: "So: a"
          - strong [ref=f42e451]: brand-styled static map image
          - text: (Mapbox's Static Images API renders your custom style to a single URL, no JS at all) with the pins drawn on, and a Directions button that opens the person's
          - strong [ref=f42e452]: own
          - text: maps app â€”
          - code [ref=f42e453]: maps.apple.com/?daddr=â€¦
          - text: on iOS,
          - code [ref=f42e454]: google.com/maps/dir/?api=1&destination=â€¦
          - text: everywhere else. Faster, cheaper, and it converts better because it ends in turn-by-turn rather than in a widget.
      - paragraph [ref=f42e455]:
        - text: Two caveats worth stating. First, if you ever pass roughly eight locations, a real store locator with search and filtering does start to earn its weight â€” at that point go
        - strong [ref=f42e456]: Mapbox or MapLibre, not Google
        - text: ", because brand styling is the entire point on a site that looks like this. Second,"
        - code [ref=f42e457]: next.config.mjs
        - text: sets
        - code [ref=f42e458]: "output: \"export\""
        - text: ", so a static build can't hide a Mapbox token server-side; use a public token restricted by URL, which is what those tokens are designed for."
