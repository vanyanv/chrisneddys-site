      - heading "What Otter Direct actually gives you." [level=2] [ref=f44e360]
      - paragraph [ref=f44e361]: "I opened your storefront in a real browser and tested it rather than guessing. Four findings change the design:"
      - table [ref=f44e363]:
        - rowgroup [ref=f44e364]:
