      - generic [ref=f44e446]:
        - heading "For three locations, don't ship a slippy map" [level=3] [ref=f44e447]
        - paragraph [ref=f44e448]:
          - text: "A visitor has exactly two questions:"
          - strong [ref=f44e449]: which one is closest
          - text: ", and"
          - strong [ref=f44e450]: get me there
          - text: . Neither is answered by pan and zoom â€” they're answered by a picture and a button. A pannable map is a widget people fiddle with instead of leaving for the navigation app they were always going to use.
        - paragraph [ref=f44e451]:
          - text: "So: a"
          - strong [ref=f44e452]: brand-styled static map image
          - text: (Mapbox's Static Images API renders your custom style to a single URL, no JS at all) with the pins drawn on, and a Directions button that opens the person's
          - strong [ref=f44e453]: own
          - text: maps app â€”
          - code [ref=f44e454]: maps.apple.com/?daddr=â€¦
          - text: on iOS,
          - code [ref=f44e455]: google.com/maps/dir/?api=1&destination=â€¦
          - text: everywhere else. Faster, cheaper, and it converts better because it ends in turn-by-turn rather than in a widget.
      - paragraph [ref=f44e456]:
        - text: Two caveats worth stating. First, if you ever pass roughly eight locations, a real store locator with search and filtering does start to earn its weight â€” at that point go
        - strong [ref=f44e457]: Mapbox or MapLibre, not Google
        - text: ", because brand styling is the entire point on a site that looks like this. Second,"
        - code [ref=f44e458]: next.config.mjs
        - text: sets
        - code [ref=f44e459]: "output: \"export\""
        - text: ", so a static build can't hide a Mapbox token server-side; use a public token restricted by URL, which is what those tokens are designed for."
    - generic [ref=f44e460]:
      - generic [ref=f44e461]: The design consequence
      - heading "No cart. One tap per item." [level=2] [ref=f44e462]
      - generic [ref=f44e463]:
        - heading "Why the cart from round two is gone" [level=3] [ref=f44e464]
        - paragraph [ref=f44e465]:
          - text: Round two had a working cart because it was showing you the world where Otter's API exists. With Otter Direct only, a cart on your domain would collect four items and then drop the customer on a storefront with an empty basket.
