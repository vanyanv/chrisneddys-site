            - cell "Item deep links" [ref=f44e371]
            - cell "WORKS" [ref=f44e372]
            - cell [ref=f44e373]:
              - text: Appending
              - code [ref=f44e374]: "/{Item Name}/{item-uuid}"
              - text: to the store URL opens that item's add-to-cart modal directly. Every item on your site can be one tap from being in a cart.
          - row [ref=f44e375]:
            - cell "Canonical URL" [ref=f44e376]
            - cell "WRONG ONE" [ref=f44e377]
            - cell [ref=f44e378]:
              - text: Your site links the
              - code [ref=f44e379]: chris-n-eddys-(3pd)
              - text: slug. The storefront's own canonical is
              - code [ref=f44e380]: chris-n-eddys
              - text: . Prices are identical on both â€” but use the clean one.
          - row [ref=f44e381]:
            - cell "Modifier prefill" [ref=f44e382]
            - cell "NOT POSSIBLE" [ref=f44e383]
            - cell "Toppings can't be set from a URL. So the site must not make people pick toppings twice â€” it names the boxes instead." [ref=f44e384]
          - row [ref=f44e385]:
            - cell "Multi-item cart prefill" [ref=f44e386]
