<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chris N Eddy's Foam Trucker — Blue — social card source</title>
    <!--
  Source for /public/shop/foam-trucker-blue.png, the product's social card and
  its `Product.image` in structured data.

  It states only what is known about the cap: the name, the price, that
  Capsule 01 is limited to 50 and individually numbered, and that it is one
  size fits most. The photo is the real hero shot — the same `front.webp`
  the product page's gallery uses — inlined as a data URI by
  `inlineLocalImages()` below so headless Chrome can actually load it from a
  `file://` page.

  It is a real PNG in /public rather than a generated `opengraph-image` route
  because a static export writes that route to an extensionless file, which
  serves as application/octet-stream — no use to Google Images, and no use to a
  link preview. `og.jpg` for the site as a whole is a real file for the same
  reason; this follows it.

  Regenerate with: node scripts/render-merch-og.mjs
-->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=JetBrains+Mono:wght@700;800&display=swap"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      body {
        display: flex;
        background: #e63027;
        color: #fff2c9;
        font-family: "Bowlby One", Impact, sans-serif;
        overflow: hidden;
      }
      /* The halftone the site puts on every red panel. */
      .dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(#1a1612 1.7px, transparent 1.9px);
        background-size: 19px 19px;
        opacity: 0.1;
      }
      .left {
        position: relative;
        z-index: 2;
        flex: 1;
        padding: 52px 0 50px 68px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .flag {
        align-self: flex-start;
        background: #1a1612;
        color: #f5b82e;
        font-size: 25px;
        letter-spacing: 0.09em;
        padding: 13px 17px;
        line-height: 1;
        transform: rotate(-1.5deg);
      }
      h1 {
        font-size: 76px;
        line-height: 0.94;
        letter-spacing: 0.01em;
        text-shadow: 5px 5px 0 #1a1612;
      }
      h1 em {
        font-style: normal;
        display: block;
        color: #f5b82e;
        font-size: 98px;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 20px;
        margin-top: 22px;
      }
      .price {
        font-family: "JetBrains Mono", monospace;
        font-size: 62px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .size {
        font-family: "JetBrains Mono", monospace;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.18em;
        opacity: 0.92;
      }
      .foot {
        font-family: "JetBrains Mono", monospace;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.12em;
        white-space: nowrap;
      }
      /* The hero gallery shot — `front.webp`, read straight off disk by
     `inlineLocalImages()` — square, so a square frame. Cutout-on-white, ink
     border and hard offset shadow, same printed-plate treatment the old
     ball-cap card gave its own photo. */
      .right {
        position: relative;
        z-index: 2;
        width: 470px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .shot {
        width: 380px;
        aspect-ratio: 1 / 1;
        border: 5px solid #1a1612;
        background: #fffdf6;
        transform: rotate(-2.5deg);
        box-shadow: 12px 14px 0 rgba(26, 22, 18, 0.42);
        overflow: hidden;
        line-height: 0;
      }
      .shot img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
    </style>
  </head>
  <body>
    <span class="dots"></span>
    <div class="left">
      <span class="flag">ONLY 50 MADE</span>
      <div>
        <h1>THE FOAM TRUCKER<em>&mdash; BLUE</em></h1>
        <div class="row">
          <span class="price">$48.00</span>
          <span class="size">ONE SIZE FITS MOST</span>
        </div>
      </div>
      <div class="foot">CHRISNEDDYS.COM/SHOP &middot; CAPSULE 01 &middot; NUMBERED /50</div>
    </div>
    <div class="right">
      <div class="shot">
        <img src="../public/shop/foam-trucker-blue/front.webp" alt="" />
      </div>
    </div>
  </body>
</html>
